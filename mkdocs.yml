site_name: opencode-repo-search
site_description: Local committed-source search for OpenCode, with independent code, reference and scientific-note corpora.
site_url: https://vanamartin.github.io/opencode-repo-search/
repo_url: https://github.com/VanaMartin/opencode-repo-search
repo_name: GitHub
edit_uri: blob/main/docs/content/
docs_dir: docs/content
site_dir: site
strict: true
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  nav_style: dark
  highlightjs: false
plugins:
  - search
markdown_extensions:
  - admonition
  - md_in_html
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
hooks:
  - docs/hooks.py
watch:
  - payload/docs/agent-search.md
  - RELEASING.md
  - CHANGELOG.md
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Overview: index.md
  - Guides:
      - Getting started: getting-started.md
      - Corpus management: corpora.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Architecture: architecture.md
      - Operations manual: operations.md
  - Project:
      - Development: development.md
      - Release workflow: releasing.md
      - Changelog: changelog.md
copyright: 'BSD-3-Clause · <a href="https://github.com/VanaMartin/opencode-repo-search/blob/main/LICENSE">License</a>'
